[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemic-risk-network"
version = "0.1.0"
description = "Validated computational model of systemic risk in a heterogeneous financial network"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
